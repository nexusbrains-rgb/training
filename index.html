<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>受講ポータル</title>
<style>
:root{
  --bg:#ffffff; --ink:#0e1620; --muted:#5c6b7a; --line:#e6eaee;
  --surface:#f5f8fa; --primary:#1493DA; --primary-d:#0d6fa8; --accent:#EF3E77;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.6;
}
#app{max-width:1080px;margin:0 auto;padding:0 20px 64px;min-height:100vh}
.center{text-align:center}.muted{color:var(--muted)}.sm{font-size:13px}
a{color:var(--primary)}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:22px;height:22px;border-radius:6px;background:var(--primary);box-shadow:inset 0 0 0 4px #fff,0 0 0 2px var(--primary)}
.brand-name{font-weight:700;font-size:18px;letter-spacing:.02em}
.header-right{display:flex;align-items:center;gap:12px}
.who{color:var(--muted);font-size:13px}

/* progress */
.progress-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:22px}
.progress-label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress-label strong{color:var(--ink);font-size:14px}
.bar{height:8px;background:#e3e9ee;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .4s ease}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{text-align:left;padding:0;border:1px solid var(--line);background:#fff;border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;font:inherit;color:inherit;width:100%}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,147,218,.12);border-color:#cfe6f6}
.card:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.thumb{position:relative;aspect-ratio:16/9;background:#0e1620;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0e1620,#22303c);color:#8fa6b6;font-weight:700;letter-spacing:.1em}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;padding-left:3px;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s}
.card:hover .play{transform:translate(-50%,-50%) scale(1.08)}
.viewed-tag{position:absolute;left:10px;top:10px;background:var(--primary);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.card-body{padding:12px 14px 14px}
.card-title{margin:0 0 10px;font-size:15px;line-height:1.45;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;justify-content:space-between}
.provider{font-size:12px;color:var(--muted)}
.count-badge{display:inline-flex;align-items:center;gap:5px;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px}
.count-badge.lg{font-size:14px;padding:6px 14px}
.count-badge.sm{font-size:12px;padding:3px 9px}

/* player */
.player-view{max-width:860px;margin:0 auto}
.back{margin-bottom:14px}
.player-frame{position:relative;padding-top:56.25%;background:#000;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.player-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:16px 0 4px;flex-wrap:wrap}
.player-title{margin:0;font-size:20px;font-weight:700}

/* empty / auth */
.empty,.auth-box{max-width:440px;margin:56px auto;text-align:center}
.empty-mark{width:60px;height:60px;border-radius:16px;background:var(--surface);border:1px dashed #c7d2db;color:var(--primary);font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.empty h2,.auth-box h2{margin:0 0 8px;font-size:20px}
.auth-box .card-panel{border:1px solid var(--line);border-radius:var(--radius);padding:24px;text-align:left;margin-top:20px}

/* buttons + inputs */
.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s}
.btn:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--primary-d)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn.block{width:100%}
.input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(20,147,218,.15)}
.err{color:var(--accent);font-size:13px;margin:6px 0}
.ok{color:var(--primary-d);font-size:13px;margin:6px 0}
.hint{font-size:12px;color:var(--muted);margin-top:12px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(14,22,32,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.narrow{max-width:420px}
.modal-title{margin:0 0 6px;font-size:19px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.admin-section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.admin-section:first-of-type{border-top:0;padding-top:6px;margin-top:8px}
.admin-section h3{margin:0 0 8px;font-size:15px}
.admin-section .btn{margin-top:8px}
.admin-list{list-style:none;margin:0;padding:0}
.admin-list li{padding:8px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.row-title{flex:1;font-size:14px}
.link{background:none;border:0;color:var(--primary);font:inherit;font-size:13px;cursor:pointer;padding:2px 4px}
.link:hover{text-decoration:underline}.link.danger{color:var(--accent)}
.names{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12px}
.setup-warn{margin:40px auto;max-width:560px;background:#fff7e6;border:1px solid #ffe0a3;color:#8a5a00;border-radius:12px;padding:18px 20px}
.setup-warn code{background:#fff;padding:1px 6px;border-radius:5px}

@media (max-width:520px){#app{padding:0 14px 48px}.grid{grid-template-columns:1fr 1fr;gap:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><p class="muted center" style="margin-top:80px">読み込み中…</p></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ==========================================================
   ① ここだけ書き換えてください
   ========================================================== */
const SUPABASE_URL      = 'https://eccauezzltweeyqgwqmt.supabase.co'; // Supabase の Project URL
const SUPABASE_ANON_KEY = 'sb_publishable_k9umF_zB0D3raSVF7mdtKQ_kXFQnlOC'; // Supabase の Publishable key
const PORTAL_NAME       = '受講ポータル';                      // 画面左上のタイトル（任意）
/* ========================================================== */

const configured = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON');
const sb = configured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const app = document.getElementById('app');
const esc = (s) => (s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- 動画URLの解析 ---- */
function parseVideo(raw){
  if(!raw) return null;
  const url = raw.trim();
  const yt = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if(yt) return {provider:'youtube', video_id:yt[1]};
  const vm = url.match(/vimeo\.com\/(?:video\/|channels\/[^/]+\/|groups\/[^/]+\/videos\/)?(\d{6,})/);
  if(vm) return {provider:'vimeo', video_id:vm[1]};
  return null;
}
const embedSrc = (v) => v.provider==='youtube'
  ? `https://www.youtube.com/embed/${v.video_id}?rel=0&modestbranding=1`
  : `https://player.vimeo.com/video/${v.video_id}`;
const thumbSrc = (v) => v.provider==='youtube'
  ? `https://img.youtube.com/vi/${v.video_id}/hqdefault.jpg` : null;

/* ---- 状態 ---- */
let me=null, isAdmin=false, myName='', videos=[], myViewed=new Set(), selected=null;

/* ---- 起動 ---- */
async function init(){
  if(!configured){ renderSetupNeeded(); return; }
  sb.auth.onAuthStateChange((_e, session)=> handleSession(session));
  const { data:{ session } } = await sb.auth.getSession();
  handleSession(session);
}
async function handleSession(session){
  me = session?.user || null;
  if(!me){ renderLogin(); return; }
  await upsertProfile();
  isAdmin = await checkAdmin();
  await Promise.all([loadVideos(), loadMyViews(), loadMyName()]);
  renderMain();
}
async function checkAdmin(){ try{ const {data}=await sb.rpc('is_admin'); return !!data; }catch{ return false; } }
async function upsertProfile(){ try{ await sb.from('profiles').upsert({user_id:me.id, email:me.email, updated_at:new Date().toISOString()}, {onConflict:'user_id'}); }catch(e){} }
async function loadMyName(){ try{ const {data}=await sb.from('profiles').select('display_name').eq('user_id',me.id).single(); myName=data?.display_name||''; }catch{ myName=''; } }
async function loadVideos(){ const {data}=await sb.from('videos').select('*').order('position').order('created_at'); videos=data||[]; }
async function loadMyViews(){ const {data}=await sb.from('views').select('video_id').eq('user_id',me.id); myViewed=new Set((data||[]).map(r=>r.video_id)); }
async function markViewed(v){
  if(myViewed.has(v.id)) return;
  await sb.from('views').upsert({user_id:me.id, video_id:v.id}, {onConflict:'user_id,video_id', ignoreDuplicates:true});
  myViewed.add(v.id);
}

/* =================== 画面描画 =================== */
function renderSetupNeeded(){
  app.innerHTML = `<div class="setup-warn">
    <h2 style="margin:0 0 8px">セットアップが未完了です</h2>
    <p>このファイル上部の <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を、ご自身の Supabase プロジェクトの値に書き換えてから再アップロードしてください。</p>
  </div>`;
}

function header(){
  return `<div class="header">
    <div class="brand"><span class="mark"></span><span class="brand-name">${esc(PORTAL_NAME)}</span></div>
    <div class="header-right">
      ${me? `<span class="who">${esc(myName||me.email)} さん</span>`:''}
      ${isAdmin? `<button class="btn ghost sm" id="admin-btn">管理</button>`:''}
      ${me? `<button class="btn ghost sm" id="logout-btn">ログアウト</button>`:''}
    </div>
  </div>`;
}

function renderLogin(){
  app.innerHTML = `${header()}
    <div class="auth-box">
      <h2>ログイン</h2>
      <p class="muted">メールアドレスを入力すると、ログイン用リンクが届きます。</p>
      <div class="card-panel">
        <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        <div id="login-msg"></div>
        <button class="btn primary block" id="send-btn">ログインリンクを送る</button>
        <p class="hint">パスワードは不要です。届いたメール内のリンクを開くとログインできます。</p>
      </div>
    </div>`;
  const emailEl=document.getElementById('email');
  const btn=document.getElementById('send-btn');
  const msg=document.getElementById('login-msg');
  const send=async()=>{
    const email=emailEl.value.trim();
    if(!email){ msg.innerHTML='<p class="err">メールアドレスを入力してください。</p>'; return; }
    btn.disabled=true; msg.innerHTML='<p class="muted sm">送信中…</p>';
    const { error }=await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.href.split('#')[0] } });
    btn.disabled=false;
    msg.innerHTML = error
      ? `<p class="err">送信に失敗しました：${esc(error.message)}</p>`
      : '<p class="ok">メールを送信しました。受信トレイのリンクを開いてください（迷惑メールもご確認ください）。</p>';
  };
  btn.onclick=send;
  emailEl.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
}

function renderMain(){
  const total=videos.length, viewed=myViewed.size, pct=total?Math.round(viewed/total*100):0;
  const progress = (total>0)? `<div class="progress-wrap">
      <div class="progress-label"><span>あなたの視聴状況</span><strong>${viewed} / ${total} 教材</strong></div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>`:'';
  let body;
  if(total===0){
    body = `<div class="empty">
      <div class="empty-mark">＋</div>
      <h2>教材がまだありません</h2>
      <p class="muted">${isAdmin?'「管理」から YouTube / Vimeo の動画を追加してください。':'教材が追加されるまでお待ちください。'}</p>
    </div>`;
  } else {
    body = `<div class="grid">${videos.map(cardHtml).join('')}</div>`;
  }
  app.innerHTML = header()+progress+body;
  bindHeader();
  if(total>0){ document.querySelectorAll('[data-open]').forEach(el=>{ el.onclick=()=>openVideo(el.dataset.open); }); }
  if(needName()) askName();
  else { const nm=document.getElementById('name-modal'); if(nm) nm.remove(); }
}
function cardHtml(v){
  const t=thumbSrc(v); const viewed=myViewed.has(v.id);
  return `<button class="card" data-open="${v.id}">
    <div class="thumb">
      ${t?`<img src="${t}" alt="" loading="lazy" />`:`<div class="thumb-fallback"><span>Vimeo</span></div>`}
      <span class="play">▶</span>${viewed?`<span class="viewed-tag">視聴済み</span>`:''}
    </div>
    <div class="card-body">
      <h3 class="card-title">${esc(v.title)}</h3>
      <div class="card-meta"><span class="provider">${v.provider==='youtube'?'YouTube':'Vimeo'}</span></div>
    </div>
  </button>`;
}

async function openVideo(id){
  selected=videos.find(v=>v.id===id); if(!selected) return;
  await markViewed(selected);
  app.innerHTML = header()+`<div class="player-view">
    <button class="btn ghost sm back" id="back-btn">← 一覧に戻る</button>
    <div class="player-frame"><iframe src="${embedSrc(selected)}" title="${esc(selected.title)}"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <div class="player-head"><h2 class="player-title">${esc(selected.title)}</h2></div>
    <p class="muted sm">この教材を開いた時点で「視聴済み」として記録されました。</p>
  </div>`;
  bindHeader();
  document.getElementById('back-btn').onclick=()=>{ selected=null; renderMain(); };
}

function bindHeader(){
  const a=document.getElementById('admin-btn'); if(a) a.onclick=openAdmin;
  const l=document.getElementById('logout-btn'); if(l) l.onclick=async()=>{ await sb.auth.signOut(); };
}

/* ---- 表示名の設定 ---- */
function needName(){ return !myName; }
function askName(){
  if(document.getElementById('name-modal')) return; // 既に表示中なら二重に出さない
  const box=document.createElement('div');
  box.id='name-modal';
  box.className='overlay';
  box.innerHTML=`<div class="modal narrow">
    <h2 class="modal-title">お名前を教えてください</h2>
    <p class="muted">受講記録に表示されます（任意・後から変更可）。</p>
    <input class="input" id="name-in" placeholder="例）山田 太郎（○○株式会社）" />
    <div class="modal-actions">
      <button class="btn ghost" id="name-skip">スキップ</button>
      <button class="btn primary" id="name-save">保存</button>
    </div></div>`;
  document.body.appendChild(box);
  const inp=box.querySelector('#name-in'); inp.focus();
  const close=()=>box.remove();
  box.querySelector('#name-skip').onclick=()=>{ myName=' '; close(); }; // スキップ時は再表示しない
  const save=async()=>{
    const name=inp.value.trim(); if(!name){ close(); return; }
    await sb.from('profiles').upsert({user_id:me.id, display_name:name, email:me.email, updated_at:new Date().toISOString()},{onConflict:'user_id'});
    myName=name; close(); renderMain();
  };
  box.querySelector('#name-save').onclick=save;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') save(); });
}

/* ---- 管理パネル ---- */
async function openAdmin(){
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.onmousedown=(e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML=`<div class="modal"><div class="admin-head"><h2 class="modal-title">管理</h2>
    <button class="btn ghost sm" id="ad-close">閉じる</button></div><div id="ad-body"></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#ad-close').onclick=()=>overlay.remove();
  await renderAdminBody(overlay.querySelector('#ad-body'));
}
async function renderAdminBody(el){
  // 集計（管理者は全視聴記録を取得できる）
  const { data:allViews } = await sb.from('views').select('user_id, video_id');
  const counts={}; (allViews||[]).forEach(r=>{ counts[r.video_id]=(counts[r.video_id]||0)+1; });
  el.innerHTML=`
    <section class="admin-section"><h3>教材を追加</h3>
      <input class="input" id="v-title" placeholder="タイトル（例：第1回 オリエンテーション）" />
      <input class="input" id="v-url" placeholder="YouTube または Vimeo のURL" />
      <div id="v-msg"></div>
      <button class="btn primary" id="v-add">追加する</button>
    </section>
    <section class="admin-section"><h3>教材一覧（${videos.length}）</h3>
      ${videos.length===0?'<p class="muted">まだ教材がありません。</p>':
        `<ul class="admin-list">${videos.map(v=>`
          <li>
            <div class="row">
              <span class="row-title">${esc(v.title)}</span>
              <span class="count-badge sm">👁 ${counts[v.id]||0}</span>
              <button class="link" data-names="${v.id}">内訳</button>
              <button class="link danger" data-del="${v.id}">削除</button>
            </div>
            <div class="names" id="names-${v.id}" style="display:none"></div>
          </li>`).join('')}</ul>`}
    </section>`;
  // 追加
  el.querySelector('#v-add').onclick=async()=>{
    const title=el.querySelector('#v-title').value.trim();
    const url=el.querySelector('#v-url').value.trim();
    const msg=el.querySelector('#v-msg');
    const parsed=parseVideo(url);
    if(!title){ msg.innerHTML='<p class="err">タイトルを入力してください。</p>'; return; }
    if(!parsed){ msg.innerHTML='<p class="err">URLを認識できませんでした。YouTube か Vimeo のリンクを貼ってください。</p>'; return; }
    const { error }=await sb.from('videos').insert({title, provider:parsed.provider, video_id:parsed.video_id, position:videos.length});
    if(error){ msg.innerHTML=`<p class="err">追加に失敗しました：${esc(error.message)}</p>`; return; }
    await loadVideos(); await renderAdminBody(el);
  };
  // 削除
  el.querySelectorAll('[data-del]').forEach(b=>{ b.onclick=async()=>{
    await sb.from('videos').delete().eq('id', b.dataset.del);
    await loadVideos(); await loadMyViews(); await renderAdminBody(el);
  };});
  // 内訳（氏名一覧）
  el.querySelectorAll('[data-names]').forEach(b=>{ b.onclick=async()=>{
    const id=b.dataset.names; const box=el.querySelector('#names-'+id);
    if(box.style.display==='flex'){ box.style.display='none'; return; }
    box.style.display='flex'; box.innerHTML='<span class="muted sm">読み込み中…</span>';
    const ids=(allViews||[]).filter(r=>r.video_id===id).map(r=>r.user_id);
    if(ids.length===0){ box.innerHTML='<span class="muted sm">閲覧者はまだいません。</span>'; return; }
    const { data:profs }=await sb.from('profiles').select('user_id, display_name, email').in('user_id', ids);
    const map={}; (profs||[]).forEach(p=>{ map[p.user_id]=p.display_name||p.email||'（不明）'; });
    box.innerHTML=ids.map(u=>`<span class="chip">${esc(map[u]||'（不明）')}</span>`).join('');
  };});
}

init();
</script>
</body>
</html>
